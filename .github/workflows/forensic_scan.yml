name: Automated Forensic Scan

on:
  push:
    paths:
      - "evidence/**"
      - "forensic_agent.py"
      - "requirements.txt"
      - ".github/workflows/forensic_scan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forensic_scan:
    name: Test and scan evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        run: pytest -q

      - name: Generate forensic report
        run: python forensic_agent.py --evidence evidence --output manus_report.json

      - name: Upload forensic report
        uses: actions/upload-artifact@v4
        with:
          name: manus-forensic-report
          path: manus_report.json
          if-no-files-found: error
          retention-days: 14
